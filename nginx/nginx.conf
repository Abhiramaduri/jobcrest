events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format extracting client IP from X-Forwarded-For
    log_format loadbalancer '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for" '
                            'upstream: $upstream_addr rt=$request_time uct=$upstream_connect_time';

    access_log /var/log/nginx/access.log loadbalancer;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ─────────────────────────────────────────────────────────
    # UPSTREAM LOAD BALANCING POOL (Horizontal Scaling)
    # ─────────────────────────────────────────────────────────
    upstream jobcrest_backend_cluster {
        # least_conn algorithm distributes traffic to least busy instance
        least_conn;
        server backend_1:8000 max_fails=3 fail_timeout=10s;
        server backend_2:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ─────────────────────────────────────────────────────────
    # EDGE RATE LIMITING ZONES (Defense-in-Depth)
    # ─────────────────────────────────────────────────────────
    # General API limit: 60 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/m;

    # Strict Auth limit (Login, Register, Password Reset, OTP): 5 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint for external monitoring / LB liveness probes
        location = /healthz {
            access_log off;
            proxy_pass http://jobcrest_backend_cluster/api/health/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # ─────────────────────────────────────────────────────
        # AUTH ENDPOINTS: Edge Rate Limiting + Load Balancing
        # ─────────────────────────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://jobcrest_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Essential Load Balancer Headers for Django Real IP Extraction
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ─────────────────────────────────────────────────────
        # GENERAL API ENDPOINTS: Load Balancing Across Nodes
        # ─────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=general_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://jobcrest_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Static assets
        location /static/ {
            proxy_pass http://jobcrest_backend_cluster;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Default catch-all
        location / {
            proxy_pass http://jobcrest_backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
