services:
  - type: web
    name: jobcrest
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    scaling:
      minInstances: 1
      maxInstances: 3
      targetCPUPercent: 75
      targetMemoryPercent: 75
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: jobcrest-rjbx.onrender.com,localhost,127.0.0.1
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CORS_ALLOW_CREDENTIALS
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://jobcrest-rjbx.onrender.com
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://jobcrest-rjbx.onrender.com
      - key: DEFAULT_FROM_EMAIL
        value: "JobCrest <aduriabhiram1234@gmail.com>"
      - key: USE_S3
        value: "True"
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_REGION_NAME
        value: us-east-1
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: NUM_PROXIES
        value: "1"
      - key: USE_X_FORWARDED_HOST
        value: "True"
      - key: THROTTLE_AUTH_LOGIN_RATE
        value: 5/min
      - key: THROTTLE_AUTH_REGISTER_RATE
        value: 5/min
      - key: THROTTLE_AUTH_PASSWORD_RESET_RATE
        value: 3/min
      - key: THROTTLE_AUTH_OTP_RATE
        value: 5/min
